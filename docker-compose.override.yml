# Development overrides — applied automatically by `docker compose up`
# Mounts source directories for hot reload.

name: homehub

services:

  frontend:
    # Local dev builds get their own name, so they never replace published images.
    image: homehub-frontend-dev
    build:
      target: production   # stays as nginx placeholder until Phase 4
    ports:
      - "4200:80"

  backend:
    image: homehub-backend-dev
    build:
      target: dev
    volumes:
      - ./packages/backend/src:/app/src
      - homehub-data:/data
    environment:
      - NODE_ENV=development
    # network_mode: host is inherited from docker-compose.yml

  mcp-server:
    image: homehub-mcp-server-dev
    build:
      target: dev
    volumes:
      - ./packages/mcp-server/src:/app/src
    environment:
      - NODE_ENV=development

  scheduler:
    image: homehub-scheduler-dev
    build:
      target: dev
    volumes:
      - ./packages/scheduler/src:/app/src
    environment:
      - NODE_ENV=development

  wyze-bridge:
    image: homehub-wyze-bridge-dev

  voice-bridge:
    image: homehub-voice-bridge-dev

  ollama:
    # Shorter healthcheck wait in dev
    healthcheck:
      start_period: 60s
