name: homehub

# HomeHub's own images are published to Docker Hub for 64-bit ARM (Raspberry Pi).
# `docker compose -f docker-compose.yml pull` downloads them; `up -d --build`
# builds them from this source instead. scripts/release-images.sh publishes.

services:

  # ── Angular frontend served by Nginx ──────────────────────────
  frontend:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-frontend:${HOMEHUB_TAG:-latest}
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "4200:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - homehub-net

  # ── Node.js core backend ───────────────────────────────────────
  # NOTE: network_mode: host is used so tplink-smarthome-api can
  # send/receive UDP broadcast packets for device discovery.
  # When host networking is active, remove the `networks` key and
  # the `ports` mapping is implicit (binds directly to host port).
  # Service names don't resolve across that boundary: the backend reaches
  # other services on localhost through their published ports, and they
  # reach it on host.docker.internal.
  backend:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-backend:${HOMEHUB_TAG:-latest}
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: production
      args:
        # The release version baked into the image. Set during release
        # builds (e.g. CI passes the git tag); falls back to "dev" for
        # local builds. Surfaced at runtime via /api/system/version.
        HOMEHUB_VERSION: ${HOMEHUB_VERSION:-dev}
    env_file: &env-file
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/db.sqlite
      - OLLAMA_URL=http://localhost:11434
      - SCHEDULER_URL=http://localhost:3002
      # Watchtower sits on the bridged homehub-net; backend uses host
      # networking so it reaches Watchtower via the localhost-bound
      # port mapping (8080) rather than service-name DNS.
      - WATCHTOWER_URL=http://localhost:8080
      # Wyze camera bridge: its API, and its go2rtc for live video
      - WYZE_BRIDGE_URL=http://localhost:5080
      - WYZE_GO2RTC_URL=http://localhost:1984
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      # Tells the backend whether the camera bridge is part of this install.
      - HOMEHUB_CAMERA_BRIDGE=${HOMEHUB_CAMERA_BRIDGE:-1}
      # The name HomeHub answers to on the home network: http://homehub.local:4200.
      # Set HOMEHUB_LOCAL_NAME in .env to change it, or to `off`.
      - HOMEHUB_LOCAL_NAME=${HOMEHUB_LOCAL_NAME:-homehub}
    labels:
      # Tell Watchtower this container is eligible for auto-recreation
      # when /api/system/update fires. Mirrors the WATCHTOWER_LABEL_ENABLE
      # opt-in posture — anything not labeled stays untouched.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - homehub-data:/data
    network_mode: host
    depends_on:
      ollama:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── MCP server (AI agent bridge) ──────────────────────────────
  mcp-server:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-mcp-server:${HOMEHUB_TAG:-latest}
    build:
      context: ./packages/mcp-server
      dockerfile: Dockerfile
      target: production
    ports:
      - "3001:3001"
    env_file: *env-file
    environment:
      - PORT=3001
      - BACKEND_URL=http://host.docker.internal:3000
      # MCP_SECRET and INTERNAL_API_KEY, generated by the backend unless set in .env
      - HOMEHUB_SECRETS_DIR=/data/secrets
    volumes:
      - homehub-data:/data:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    extra_hosts: *host-gateway
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - homehub-net

  # ── Automation scheduler (cron + solar) ───────────────────────
  scheduler:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-scheduler:${HOMEHUB_TAG:-latest}
    build:
      context: ./packages/scheduler
      dockerfile: Dockerfile
      target: production
    ports:
      - "3002:3002"
    env_file: *env-file
    environment:
      - SCHEDULER_PORT=3002
      - BACKEND_URL=http://host.docker.internal:3000
      - SCHEDULER_URL=http://scheduler:3002
      - DB_PATH=/data/db.sqlite
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    extra_hosts: *host-gateway
    volumes:
      - homehub-data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - homehub-net

  # ── Local LLM (Ollama) ─────────────────────────────────────────
  ollama:
    # Pinned, like every image here, so updates only arrive when this file changes.
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      sleep 8 &&
      ollama pull ${OLLAMA_MODEL:-llama3.2:3b} &&
      wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - homehub-net

  # ── Watchtower sidecar (manual-trigger HomeHub self-update) ───
  # Owns the docker socket so it can recreate other containers
  # (including the backend that pokes it) without dying mid-update.
  # See auraflow/docs/ota-strategy.md "option A" for the full flow.
  #
  # WATCHTOWER_HTTP_API_TOKEN must be set in .env. The backend reads
  # the same value to authenticate requests to /v1/update.
  #
  # The 1-year `--interval` is the closest Watchtower offers to "no
  # periodic polling" — nothing fires unless the HTTP API is poked.
  watchtower:
    # 1.7.1 is Watchtower's last release.
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homehub-data:/homehub:ro
    depends_on:
      backend:
        condition: service_healthy   # it makes the token file
    environment:
      # Set in .env, or a path: Watchtower reads the token from that file,
      # which the backend generates in the data volume.
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-/homehub/secrets/WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      # Watchtower 1.7.1 defaults to an API version Docker 29 refuses.
      - DOCKER_API_VERSION=1.44
      - TZ=${TZ:-UTC}
    command: ["--interval", "31536000"]
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - homehub-net

  # ── Updater (switch HomeHub to a version, newer or older) ──────
  # The Update button and the Health page's "go back" use it. It's the only
  # HomeHub service with the Docker socket; it answers on 127.0.0.1 only,
  # with the token the backend makes, and only recreates HomeHub's own four
  # services. It records the chosen version in .env as HOMEHUB_TAG.
  updater:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-updater:${HOMEHUB_UPDATER_TAG:-latest}
    build:
      context: ./packages/updater
      target: production
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      - homehub-data:/homehub:ro
    environment:
      - PROJECT_DIR=/project
      # Set in .env, or read from the file the backend makes.
      - UPDATER_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy   # it makes the token file
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  # ── Wyze camera bridge ─────────────────────────────────────────
  # Connects to Wyze cameras with your Wyze account and serves their video
  # locally: IDisposable's maintained docker-wyze-bridge, with go2rtc.
  # HomeHub's image is that one with go2rtc rebuilt to add pan and tilt for
  # Wyze Pan cameras (packages/wyze-bridge).
  # HomeHub signs it in, lists the cameras, relays live video and takes
  # snapshots through it.
  #
  # Host networking, because the cameras are only found by a broadcast on
  # the home network. go2rtc, which has the video, listens on 127.0.0.1
  # only. The bridge's own page and API (port 5080) are on the network but
  # need HomeHub's key.
  #
  # It waits, using almost no memory, until someone signs in to Wyze on the
  # Cameras page. HomeHub saves the sign-in in its data volume's `wyze`
  # folder; the bridge reads it at start and restarts when it changes.
  # HOMEHUB_CAMERA_BRIDGE=0 in .env leaves the bridge out.
  wyze-bridge:
    image: ${HOMEHUB_IMAGE_PREFIX:-ghcr.io/foodisready}/homehub-wyze-bridge:${HOMEHUB_TAG:-latest}
    build:
      context: ./packages/wyze-bridge
      target: production
    deploy:
      replicas: ${HOMEHUB_CAMERA_BRIDGE:-1}
    network_mode: host
    environment:
      # HomeHub's key for the bridge's API. Leave it out of .env and the
      # bridge reads the one the backend made.
      - WYZE_BRIDGE_API_KEY=${WYZE_BRIDGE_API_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      - wyze-bridge-state:/config
      - homehub-data:/homehub:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        signin=/homehub/wyze
        trap 'kill $$b $$g 2>/dev/null; exit 0' TERM INT
        key="$$WYZE_BRIDGE_API_KEY"
        [ -n "$$key" ] || key="$$(cat /homehub/secrets/WYZE_BRIDGE_API_KEY)"
        echo "Waiting for a Wyze sign-in on HomeHub's Cameras page"
        until [ -s "$$signin/version" ]; do sleep 3; done
        ver="$$(cat "$$signin/version")"
        # A new sign-in starts afresh, or the bridge would keep the last account's login.
        if [ "$$(cat /config/.homehub-signin 2>/dev/null)" != "$$ver" ]; then
          rm -f /config/wyze-bridge.state.json
          echo "$$ver" > /config/.homehub-signin
        fi
        export WYZE_EMAIL="$$(cat "$$signin/email")" WYZE_PASSWORD="$$(cat "$$signin/password")"
        export WYZE_API_ID="$$(cat "$$signin/key-id")" WYZE_API_KEY="$$(cat "$$signin/api-key")"
        export BRIDGE_AUTH=true BRIDGE_API_TOKEN="$$key" BRIDGE_PASSWORD="$$key"
        export GO2RTC_URL=http://127.0.0.1:1984 STATE_DIR=/config
        # HomeHub's own go2rtc, on this computer only; the bridge adds the cameras to it.
        printf 'api:\n  listen: "127.0.0.1:1984"\nrtsp:\n  listen: "127.0.0.1:8554"\nwebrtc:\n  listen: ""\nsrtp:\n  listen: ""\n' > /tmp/go2rtc.yaml
        /usr/local/bin/go2rtc -config /tmp/go2rtc.yaml & g=$$!
        until wget -q -O /dev/null http://127.0.0.1:1984/api/streams 2>/dev/null; do sleep 1; done
        /usr/local/bin/wyze-bridge & b=$$!
        # A new sign-in, or signing out, changes the version: stop, and Docker starts it again.
        while kill -0 $$b 2>/dev/null && kill -0 $$g 2>/dev/null && [ "$$(cat "$$signin/version" 2>/dev/null)" = "$$ver" ]; do sleep 3; done
        kill $$b $$g 2>/dev/null
        wait
    depends_on:
      backend:
        condition: service_healthy   # it makes the key file
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    logging: *default-logging

  # ── Tailscale sidecar (remote access) ─────────────────────────
  tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: homehub
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:homehub
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    profiles:
      - remote-access
    networks:
      - homehub-net

volumes:
  homehub-data:
  ollama-models:
  tailscale-state:
  wyze-bridge-state:

networks:
  homehub-net:
    driver: bridge
