# Build HomeHub's five images for Raspberry Pi (arm64) and PCs (amd64) and
# publish them to GitHub's registry, ghcr.io/<owner>/homehub-<service>.
#
# - Push a version tag, such as v1.2.0: publishes that version and `latest`,
#   then creates the GitHub Release. HomeHub's Update card compares the
#   running version with the latest Release, so it offers the update only
#   once the images are ready.
# - Run it by hand (Actions → Release images → Run workflow): publishes
#   images tagged with the commit only, to try on a Pi with HOMEHUB_TAG,
#   without changing what `latest` points to.
#
# Each platform builds natively on its own runner, then one manifest per
# service joins them.
name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write    # create the Release
  packages: write    # push to ghcr.io

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, scheduler, mcp-server, updater]
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Version and image name
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homehub-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/${{ matrix.service }}
          target: production
          platforms: linux/${{ matrix.arch }}
          build-args: HOMEHUB_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=homehub-${{ matrix.service }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend, scheduler, mcp-server, updater]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the platforms under each tag
        shell: bash
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homehub-${{ matrix.service }}"
          tags=(-t "$image:${GITHUB_SHA::7}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=(-t "$image:$GITHUB_REF_NAME" -t "$image:latest"); fi
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:${GITHUB_SHA::7}"

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Create the Release, if there isn't one for this tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
